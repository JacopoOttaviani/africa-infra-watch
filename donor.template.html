{
  let stored = null;

  if (stored === "dark" || stored === "light") document.documentElement.dataset.theme = stored;
  $("#theme").onclick = () => {
    const cur = document.documentElement.dataset.theme;

  const svg = $("#map"), tip = $("#tip"), box = $(".mapbox");
  const show = (ev, html) => { tip.innerHTML = html; tip.style.display = "block"; move(ev); };
  const move = ev => { const r = box.getBoundingClientRect(); let x = ev.clientX - r.left + 14, y = ev.clientY - r.top + 14; if (x + 290 > r.width) x -= 300; if (y + 120 > r.height) y -= 130; tip.style.left = x + "px"; tip.style.top = y + "px"; };
  const hide = () => { tip.style.display = "none"; };
  const bind = (e, html) => { e.classList.add("hit"); e.setAttribute("tabindex", "0"); e.addEventListener("mousemove", ev => show(ev, html)); e.addEventListener("mouseleave", hide);
    e.addEventListener("focus", () => { tip.innerHTML = html; tip.style.display = "block"; tip.style.left = "12px"; tip.style.top = "12px"; }); e.addEventListener("blur", hide); };
  const lbl = el("g", {id: "g-lbl"});
  (DATA.map.groups || []).forEach((grp, gi) => {
    const g = el("g", {id: grp.id});
    grp.items.forEach((it, i) => {
      let e;
      const cls = (grp.cls || "") + (it.cls ? " " + it.cls : "");
      if (grp.kind === "circle") e = el("circle", {cx: it.x, cy: it.y, r: it.r || 5, class: cls || "loan"});
      else if (grp.kind === "ring") e = el("circle", {cx: it.x, cy: it.y - (grp.dy || 0), r: it.r || 6, class: cls || "ring"});
      else if (grp.kind === "diamond") e = el("path", {d: `M${it.x} ${it.y - 7} L${it.x + 7} ${it.y} L${it.x} ${it.y + 7} L${it.x - 7} ${it.y} Z`, class: "asset " + cls});
      else if (grp.kind === "triangle") e = el("path", {d: `M${it.x} ${it.y - 8} L${it.x + 7} ${it.y + 5} L${it.x - 7} ${it.y + 5} Z`, class: "asset " + cls});
      else if (grp.kind === "hex") { const r = 7, pts = [0, 1, 2, 3, 4, 5].map(k => { const a = Math.PI / 3 * k - Math.PI / 6; return (it.x + r * Math.cos(a)).toFixed(1) + " " + (it.y + r * Math.sin(a)).toFixed(1); }); e = el("path", {d: "M" + pts.join(" L") + " Z", class: "asset " + cls}); }
      else if (grp.kind === "line") e = el("path", {d: it.d, class: (grp.cls || "pipe") + (it.cls ? " " + it.cls : "")});
      else if (grp.kind === "star") { const R = 7.5, r = 3.2, pts = []; for (let k = 0; k < 10; k++) { const a = Math.PI / 5 * k - Math.PI / 2, rr = k % 2 ? r : R; pts.push((it.x + rr * Math.cos(a)).toFixed(1) + " " + (it.y + rr * Math.sin(a)).toFixed(1)); } e = el("path", {d: "M" + pts.join(" L") + " Z", class: "asset " + cls}); }
      else e = el("rect", {x: it.x - 5 + (grp.spread ? (i % 3) * 9 - 9 : 0), y: it.y + (grp.dy || 0) - 5, width: 10, height: 10, class: cls || "corp"});
      bind(e, it.tip);
      g.appendChild(e);
      if (it.label) lbl.appendChild(el("text", {x: it.x + (it.r || 5) + 3, y: it.y + 4, class: "lbl"}, it.label));
    });
    svg.appendChild(g);
  });
  svg.appendChild(lbl);
  document.querySelectorAll(".legend input[data-g]").forEach(cb => {
    const apply = () => { cb.dataset.g.split(",").forEach(id => { const grp = svg.querySelector("#" + id); if (grp) grp.style.display = cb.checked ? "" : "none"; }); };
    cb.addEventListener("change", apply); apply();
  });
}

/* ================= charts =================
   DATA.charts: {svgId: spec}. type line (a series by year, with notes),
   bars (horizontal, labelled rows) or columns (one per year, negatives
   allowed). Values are plain numbers; fmt "usd" (default) or "n". */
const fmtN = v => Math.abs(v) >= 1e9 ? (v / 1e9).toFixed(Math.abs(v) >= 1e10 ? 0 : 1) + " bn" : Math.abs(v) >= 1e6 ? (v / 1e6).toFixed(Math.abs(v) >= 1e8 ? 0 : 1) + " m" : Math.abs(v) >= 1e3 ? (v / 1e3).toFixed(0) + " k" : String(Math.round(v));
const fmt = (v, f) => f === "n" ? v.toLocaleString("en") : "USD " + fmtN(v);
const nice = v => { if (v <= 0) return 0; const p = Math.pow(10, Math.floor(Math.log10(v))); const m = v / p; const s = m <= 1 ? 1 : m <= 2 ? 2 : m <= 2.5 ? 2.5 : m <= 3 ? 3 : m <= 4 ? 4 : m <= 5 ? 5 : m <= 6 ? 6 : m <= 8 ? 8 : 10; return s * p; };
/* a round step (1, 2, 2.5, 5 × 10^k) and the axis top as a multiple of it */
const scale = (max, n = 4) => { if (max <= 0) return {step: 1, top: 1}; const step = nice(max / n); return {step, top: step * Math.ceil(max / step - 1e-9)}; };
const ticksOf = (top, step) => { const out = []; for (let v = 0; v <= top + 1e-9; v += step) out.push(v); return out; };
const axisText = (v, f) => f === "n" ? v.toLocaleString("en") : fmtN(v);

Object.entries(DATA.charts || {}).forEach(([id, c]) => {
  const svg = document.getElementById(id);
  if (!svg) return;
  const W = 520, L = c.type === "bars" ? 172 : 52, R = c.type === "bars" ? 70 : 12, T = 14, B = 30;
  if (c.type === "line") {
    const H = 240;
    const ys = Object.keys(c.series).map(Number), vs = ys.map(y => c.series[y]);
    const x = y => L + (y - ys[0]) / (ys[ys.length - 1] - ys[0]) * (W - L - R);
    const sc = scale(Math.max(...vs), 3), ymax = sc.top, y = v => T + (1 - v / ymax) * (H - T - B);
    const grid = el("g", {class: "grid"});
    ticksOf(ymax, sc.step).forEach(v => { grid.appendChild(el("line", {x1: L, x2: W - R, y1: y(v), y2: y(v)})); svg.appendChild(el("text", {x: L - 6, y: y(v) + 4, "text-anchor": "end", class: "ax"}, axisText(v, c.fmt))); });
    svg.appendChild(grid);
    const ticks = [ys[0], ...ys.filter(v => v % 10 === 0 && v > ys[0] && v < ys[ys.length - 1]), ys[ys.length - 1]];
    ticks.forEach(yy => svg.appendChild(el("text", {x: x(yy), y: H - 8, "text-anchor": "middle", class: "ax"}, yy)));
    const d = ys.map((yy, i) => (i ? "L" : "M") + x(yy).toFixed(1) + " " + y(vs[i]).toFixed(1)).join(" ");
    svg.appendChild(el("path", {d: d + ` L${x(ys[ys.length - 1]).toFixed(1)} ${y(0)} L${x(ys[0]).toFixed(1)} ${y(0)} Z`, class: "area"}));
    svg.appendChild(el("path", {d, class: "series"}));
    (c.notes || []).forEach(n => { const v = c.series[n.year]; if (v == null) return; svg.appendChild(el("circle", {cx: x(n.year), cy: y(v), r: 3.5, fill: "var(--accent)"})); svg.appendChild(el("text", {x: x(n.year) + n.dx, y: y(v) + n.dy, class: "note-pt", "text-anchor": n.anchor}, n.text)); });
    const hov = el("rect", {x: L, y: T, width: W - L - R, height: H - T - B, fill: "transparent"}); svg.appendChild(hov);
    const ln = el("line", {y1: T, y2: H - B, stroke: "var(--ink-3)", "stroke-dasharray": "3 3", style: "display:none"}); svg.appendChild(ln);
    const box = svg.parentNode, t2 = document.createElement("div"); t2.className = "tip"; box.appendChild(t2);
    hov.addEventListener("mousemove", ev => { const pt = svg.createSVGPoint(); pt.x = ev.clientX; pt.y = ev.clientY; const p = pt.matrixTransform(svg.getScreenCTM().inverse()); const yy = Math.round(ys[0] + (p.x - L) / (W - L - R) * (ys[ys.length - 1] - ys[0])); if (!(yy in c.series)) return; ln.setAttribute("x1", x(yy)); ln.setAttribute("x2", x(yy)); ln.style.display = ""; t2.innerHTML = `<b>${yy}</b>${fmt(c.series[yy], c.fmt)} ${esc(c.label || "")}`; t2.style.display = "block"; const r = box.getBoundingClientRect(); t2.style.left = Math.min(ev.clientX - r.left + 12, r.width - 200) + "px"; t2.style.top = (ev.clientY - r.top + 12) + "px"; });
    hov.addEventListener("mouseleave", () => { ln.style.display = "none"; t2.style.display = "none"; });
  } else if (c.type === "bars") {
    const rows = c.rows, rowH = 22, T2 = 6; svg.setAttribute("viewBox", `0 0 ${W} ${T2 + rows.length * rowH + 6}`);
    const max = Math.max(...rows.map(r => Math.abs(r.value))) || 1, x = v => L + v / max * (W - L - R);
    rows.forEach((r, i) => {
      const yy = T2 + i * rowH;
      svg.appendChild(el("text", {x: L - 8, y: yy + 15, "text-anchor": "end", class: "blab"}, r.label));
      const b = el("rect", {x: L, y: yy + 4, width: Math.max(2, x(Math.abs(r.value)) - L).toFixed(1), height: rowH - 8, rx: 2, class: "bar"});
      if (r.dim) b.setAttribute("fill-opacity", ".45");
      b.appendChild(el("title", {}, `${r.label}: ${r.text}`));
      svg.appendChild(b);
      svg.appendChild(el("text", {x: x(Math.abs(r.value)) + 6, y: yy + 15, class: "bval"}, r.text));
    });
  } else if (c.type === "columns") {
    const H = 240, rows = c.rows, n = rows.length, slot = (W - L - R) / n, bw = Math.min(slot * 0.68, 40);
    const hi = Math.max(0, ...rows.map(r => r.value)), lo = Math.max(0, ...rows.map(r => -r.value));
    const sc = scale(Math.max(hi, lo), lo > 0 ? 2 : 4), top = sc.step * Math.ceil(hi / sc.step - 1e-9), bot = -sc.step * Math.ceil(lo / sc.step - 1e-9);
    const y = v => T + (top - v) / (top - bot) * (H - T - B);
    const grid = el("g", {class: "grid"});
    const steps = []; for (let v = bot; v <= top + 1e-9; v += sc.step) steps.push(v);
    steps.forEach(v => { grid.appendChild(el("line", {x1: L, x2: W - R, y1: y(v), y2: y(v)})); svg.appendChild(el("text", {x: L - 6, y: y(v) + 4, "text-anchor": "end", class: "ax"}, axisText(v, c.fmt))); });
    svg.appendChild(grid);
    rows.forEach((r, i) => {
      const cx = L + slot * (i + 0.5), h = Math.abs(y(r.value) - y(0));
      const b = el("rect", {x: cx - bw / 2, y: Math.min(y(r.value), y(0)), width: bw, height: Math.max(h, 1).toFixed(1), rx: 2, class: "bar"});
      if (r.value < 0) b.setAttribute("fill-opacity", ".55");
      b.appendChild(el("title", {}, `${r.x}: ${r.text}`));
      svg.appendChild(b);
      if (n <= 16 || i % 2 === 0) svg.appendChild(el("text", {x: cx, y: H - 8, "text-anchor": "middle", class: "ax"}, r.x));
      if (n <= 12) svg.appendChild(el("text", {x: cx, y: (r.value < 0 ? y(r.value) + 12 : y(r.value) - 5), "text-anchor": "middle", class: "bval"}, r.text));
    });
    svg.appendChild(el("line", {x1: L, x2: W - R, y1: y(0), y2: y(0), stroke: "var(--ink-3)", "stroke-width": 1}));
  }
});
</script>
